[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blacktop"
version = "0.1.0"
description = "BLACKTOP reference implementation: a real-time accept/decline decision engine for gig delivery drivers (advisory-only, driver-owned data)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["blacktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
